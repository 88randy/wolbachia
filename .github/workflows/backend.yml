name: backend

# Runs only when backend/ or this workflow changes.
# Ruff and mypy versions mirror .pre-commit-config.yaml (ruff v0.17.3, mypy 2.4.1 pinned in
# backend/pyproject.toml); bump them together.
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUFF_VERSION: "0.17.3"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Keep the major version equal to the DigitalOcean managed cluster [PENDING: #18].
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wolbachia
          POSTGRES_PASSWORD: wolbachia
          POSTGRES_DB: wolbachia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wolbachia -d wolbachia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway values for the CI database and keys; not secrets.
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://wolbachia:wolbachia@127.0.0.1:5432/wolbachia
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uvx ruff@${RUFF_VERSION} check --config pyproject.toml .
      - name: Ruff format
        run: uvx ruff@${RUFF_VERSION} format --check --config pyproject.toml .
      # Runs in the project environment: the django-stubs plugin needs Django installed.
      # Strict only for services.py and selectors.py (overrides in pyproject.toml).
      - name: Mypy
        run: uv run mypy .
      # Test settings include the test-only app, so its migration is checked too.
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Tests and coverage (gate in pyproject.toml)
        run: uv run pytest --cov
      # The OpenAPI schema is validated (and the client regenerated) by api-contract.yml.
