name: backend

# Runs only when backend/ or this workflow changes.
# Ruff and mypy versions mirror .pre-commit-config.yaml (ruff v0.17.3, mypy 2.4.1 pinned in
# backend/pyproject.toml); bump them together.
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUFF_VERSION: "0.17.3"
  CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  tests:
    name: PostgreSQL (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [regular, migrations]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: wolbachia
          POSTGRES_PASSWORD: wolbachia
          POSTGRES_DB: wolbachia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wolbachia -d wolbachia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://wolbachia:wolbachia@127.0.0.1:5432/wolbachia
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run one complete serial partition (coverage data only)
        run: uv run python -m ci.runner ${{ matrix.shard }}
      - name: Preserve current partition evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ matrix.shard }}
          path: |
            backend/.pytest_cache/ci/${{ matrix.shard }}/manifest.json
            backend/.pytest_cache/ci/${{ matrix.shard }}/coverage.data
            backend/.pytest_cache/ci/${{ matrix.shard }}/session.json
            backend/.pytest_cache/ci/${{ matrix.shard }}/exit.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  checks:
    needs: [tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Keep the major version equal to the DigitalOcean managed cluster [PENDING: #18].
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: wolbachia
          POSTGRES_PASSWORD: wolbachia
          POSTGRES_DB: wolbachia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wolbachia -d wolbachia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway values for the CI database and keys; not secrets.
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://wolbachia:wolbachia@127.0.0.1:5432/wolbachia
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Require both PostgreSQL partitions to succeed
        working-directory: .
        env:
          PARTITIONS_RESULT: ${{ needs.tests.result }}
        run: test "$PARTITIONS_RESULT" = success
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uvx ruff@${RUFF_VERSION} check --config pyproject.toml .
      - name: Ruff format
        run: uvx ruff@${RUFF_VERSION} format --check --config pyproject.toml .
      # Runs in the project environment: the django-stubs plugin needs Django installed.
      # Strict only for services.py and selectors.py (overrides in pyproject.toml).
      - name: Mypy
        run: uv run mypy .
      # Test settings include the test-only app, so its migration is checked too.
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Download current regular evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-regular
          path: backend/.pytest_cache/ci-downloads/regular
      - name: Download current migration evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-migrations
          path: backend/.pytest_cache/ci-downloads/migrations
      - name: Complete inventory and combined coverage (existing 85 percent gate)
        run: uv run python -m ci.aggregate
      - name: Preserve the complete coverage result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-combined
          path: backend/.pytest_cache/ci-combined/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      # The OpenAPI schema is validated (and the client regenerated) by api-contract.yml.
