name: gitleaks

# Secret scan of the full git history on every PR and push to master (no path filter: a secret
# can land anywhere). Uses the official MIT-licensed CLI image, the same version as the
# pre-commit hook in .pre-commit-config.yaml (v8.30.1); bump both together.
# (gitleaks/gitleaks-action is avoided on purpose: it needs a paid license in organizations.)
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        # The container runs as root on a runner-owned checkout: mark /repo as safe for git
        # through environment-based config (GIT_CONFIG_COUNT/KEY_n/VALUE_n, git >= 2.31).
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
