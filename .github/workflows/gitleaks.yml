name: gitleaks

# Secret scan of the full git history on every PR and push to master (no path filter: a secret
# can land anywhere). Uses the official MIT-licensed CLI image, the same version as the
# pre-commit hook in .pre-commit-config.yaml (v8.30.1); bump both together.
# (gitleaks/gitleaks-action is avoided on purpose: it needs a paid license in organizations.)
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
