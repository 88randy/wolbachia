# Reusable job: ESLint, Prettier and tsc for one folder of the monorepo.
# Called by web.yml, mobile.yml and packages.yml. Same commands as `npm run lint|format:check|typecheck`.
name: js-checks

on:
  workflow_call:
    inputs:
      folder:
        description: Folder to check (web, mobile or packages)
        required: true
        type: string
      build:
        description: Also build the folder (npm run build -w <folder>); needs a "build" script
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOLDER: ${{ inputs.folder }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A folder without code yet matches no files: that is a pass, not a failure.
      - name: ESLint
        run: npx eslint "$FOLDER" --max-warnings=0 --no-error-on-unmatched-pattern
      - name: Prettier
        run: npx prettier --check "$FOLDER" --ignore-unknown
      - name: Type-check
        run: node scripts/typecheck.mjs "$FOLDER"
      # Only the folder under check. --workspace=<folder> also matches every workspace below it
      # (packages -> tokens, i18n); --if-present skips workspaces without a "test" script.
      # npm fails on a folder with no package.json yet, so that case is a pass.
      - name: Tests
        run: |
          if find "$FOLDER" -name package.json -not -path "*/node_modules/*" | grep -q .; then
            npm test --workspace="$FOLDER" --if-present
          else
            echo "No workspace in $FOLDER yet: nothing to test."
          fi
      # VITE_* is read at build time. The same-origin path is the default deployment [ASSUMPTION].
      - name: Build
        if: ${{ inputs.build }}
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build --workspace="$FOLDER"
