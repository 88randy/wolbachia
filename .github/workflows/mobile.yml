name: mobile

# Runs only when mobile/, a shared package or the root JS tooling changes.
# Also builds an installable debug APK (issue #63): no JDK, Android SDK or NDK is needed on the dev machine.
on:
  workflow_dispatch:
    inputs:
      abis:
        description: "CPU architectures to build (comma separated, passed as -PreactNativeArchitectures)"
        required: false
        default: arm64-v8a
        type: string
      api_base_url:
        description: "API address baked into the APK, e.g. http://192.168.1.20:8000 (plain http only for private LAN addresses). Empty: set it in Settings on the phone."
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - "mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.base.json"
      - ".prettierrc.json"
      - ".prettierignore"
      - "scripts/**"
      - ".github/workflows/mobile.yml"
      - ".github/workflows/js-checks.yml"
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.base.json"
      - ".prettierrc.json"
      - ".prettierignore"
      - "scripts/**"
      - ".github/workflows/mobile.yml"
      - ".github/workflows/js-checks.yml"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/js-checks.yml
    with:
      folder: mobile

  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # The Android app being built: an Expo project whose android/ folder is generated by `expo prebuild`.
      APP_DIR: mobile
      # Read by Expo when the JavaScript bundle is built (mobile/src/config/build-config.ts). The test tools
      # (device id, test token, test record) are on in this debug APK only. The API address is empty unless a
      # dispatch run asks for one; it can always be changed in Settings on the phone.
      EXPO_PUBLIC_DEV_TOOLS: "1"
      EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url || '' }}
      # Versions required by React Native 0.88.1 (packages/react-native/gradle/libs.versions.toml, tag v0.88.1):
      # compileSdk 37, buildTools 37.0.0, ndkVersion 27.1.12297006. Gradle 9.4.1 (Expo SDK 58 template wrapper)
      # and AGP 9.2.1 need JDK 17. See the PR for the sources.
      # sdkmanager names compileSdk 37 "android-37.0" (there are 37.1 and 37.2 too).
      ANDROID_PLATFORM: android-37.0
      ANDROID_BUILD_TOOLS: 37.0.0
      ANDROID_NDK: 27.1.12297006
      # arm64-v8a covers every current phone; a dispatch run can ask for more.
      ABIS: ${{ inputs.abis || 'arm64-v8a' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate the requested architectures
        run: |
          IFS=',' read -ra requested <<< "$ABIS"
          for abi in "${requested[@]}"; do
            case "$abi" in
              arm64-v8a | armeabi-v7a | x86_64 | x86) ;;
              *) echo "::error::Unsupported ABI '$abi'. Allowed: arm64-v8a, armeabi-v7a, x86_64, x86 (comma separated)."; exit 1 ;;
            esac
          done
      - name: Install Android SDK packages
        # The runner image ships an Android SDK; these pin the exact packages React Native asks for.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` gets SIGPIPE when sdkmanager stops reading, so pipefail is off for this one line:
          # the pipe status is then sdkmanager's own, and a real failure still stops the step.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK"
      - name: Install JS dependencies
        # mobile is an npm workspace: one lockfile at the repo root.
        run: npm ci
      - name: Generate the Android project
        working-directory: ${{ env.APP_DIR }}
        env:
          CI: "1"
        run: |
          [ -d android ] || npm run prebuild
          # React Native skips bundling the JavaScript in debug builds and expects Metro. Phones in the
          # field tests are offline, so the debug APK must carry its own bundle: no debuggable variants.
          sed -i 's|^\s*// debuggableVariants = .*|    debuggableVariants = []|' android/app/build.gradle
          grep -q '^    debuggableVariants = \[\]' android/app/build.gradle
      - name: Check that plain http is allowed in debug builds only
        working-directory: ${{ env.APP_DIR }}/android/app/src
        run: |
          if grep -q 'usesCleartextTraffic="true"' main/AndroidManifest.xml; then
            echo "::error::The main manifest allows cleartext traffic; it must only be allowed in src/debug."
            exit 1
          fi
          grep -q 'usesCleartextTraffic="true"' debug/AndroidManifest.xml
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Open-source GitHub Actions cache; the default "enhanced" provider is a commercial service.
          cache-provider: basic
      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures="$ABIS" --no-daemon --stacktrace
      - name: Check the APK
        id: apk
        working-directory: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug
        run: |
          APK=$(ls ./*.apk)
          # The JavaScript bundle must be inside the APK (no Metro on the phone).
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          ls -l "$APK"
          echo "path=$PWD/$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "short_sha=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wolbachia-debug-apk-${{ steps.apk.outputs.short_sha }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
          if-no-files-found: error
