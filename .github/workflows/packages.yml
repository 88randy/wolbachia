name: packages

# Runs only when packages/ or the root JS tooling changes.
on:
  pull_request:
    paths:
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.base.json"
      - ".prettierrc.json"
      - ".prettierignore"
      - "scripts/**"
      - ".github/workflows/packages.yml"
      - ".github/workflows/js-checks.yml"
  push:
    branches: [master]
    paths:
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.base.json"
      - ".prettierrc.json"
      - ".prettierignore"
      - "scripts/**"
      - ".github/workflows/packages.yml"
      - ".github/workflows/js-checks.yml"

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/js-checks.yml
    with:
      folder: packages
