name: web

# Runs only when web/, a shared package or the root JS tooling changes.
on:
  pull_request:
    paths:
      - "web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.base.json"
      - ".prettierrc.json"
      - ".prettierignore"
      - "scripts/**"
      - ".nvmrc"
      - "compose.yaml"
      - ".dockerignore"
      - ".github/workflows/web.yml"
      - ".github/workflows/js-checks.yml"
  push:
    branches: [master]
    paths:
      - "web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.base.json"
      - ".prettierrc.json"
      - ".prettierignore"
      - "scripts/**"
      - ".nvmrc"
      - "compose.yaml"
      - ".dockerignore"
      - ".github/workflows/web.yml"
      - ".github/workflows/js-checks.yml"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/js-checks.yml
    with:
      folder: web
      build: true

  # Real browser: layout sizes, keyboard flow and axe (WCAG 2.2 AA) in light and dark.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      # playwright.config.ts builds the app and serves it with `vite preview`.
      - name: Playwright
        run: npm run e2e --workspace=web
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7

  # The production image must build. Nothing is pushed: deploy is a separate decision (#18).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Dockerfile uses the Node version of .nvmrc
        run: |
          expected="$(tr -d '[:space:]' < .nvmrc)"
          grep -q "^ARG NODE_VERSION=${expected}$" web/Dockerfile             || { echo "web/Dockerfile NODE_VERSION must be ${expected} (.nvmrc)"; exit 1; }
      - name: Build the runtime image
        run: docker build --file web/Dockerfile --target runtime --tag wolbachia-web:ci .
