name: web

# Runs only when web/, a shared package or the root JS tooling changes.
on:
  pull_request:
    paths:
      - "web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.base.json"
      - ".prettierrc.json"
      - ".prettierignore"
      - "scripts/**"
      - ".nvmrc"
      - "compose.yaml"
      - ".dockerignore"
      - ".github/workflows/web.yml"
      - ".github/workflows/js-checks.yml"
  push:
    branches: [master]
    paths:
      - "web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.base.json"
      - ".prettierrc.json"
      - ".prettierignore"
      - "scripts/**"
      - ".nvmrc"
      - "compose.yaml"
      - ".dockerignore"
      - ".github/workflows/web.yml"
      - ".github/workflows/js-checks.yml"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/js-checks.yml
    with:
      folder: web
      build: true

  # Real browser: layout sizes, keyboard flow and axe (WCAG 2.2 AA) in light and dark.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      # playwright.config.ts builds the app and serves it with `vite preview`.
      - name: Playwright
        run: npm run e2e --workspace=web
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7

  # The production image must build. Nothing is pushed: deploy is a separate decision (#18).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Dockerfile uses the Node version of .nvmrc
        run: |
          expected="$(tr -d '[:space:]' < .nvmrc)"
          grep -q "^ARG NODE_VERSION=${expected}$" web/Dockerfile             || { echo "web/Dockerfile NODE_VERSION must be ${expected} (.nvmrc)"; exit 1; }
      - name: Compose file is valid
        run: docker compose config -q
      - name: Build the runtime image
        run: docker build --file web/Dockerfile --target runtime --tag wolbachia-web:ci .
      - name: Run the image
        run: docker run -d --name web-ci --publish 127.0.0.1:8080:8080 wolbachia-web:ci
      - name: Headers, cache and single-page fallback
        run: |
          for _ in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          index="$(curl -sI http://127.0.0.1:8080/)"
          deep="$(curl -sI http://127.0.0.1:8080/quadrants)"
          asset="$(curl -sI "http://127.0.0.1:8080/assets/$(curl -s http://127.0.0.1:8080/ | grep -o 'index-[A-Za-z0-9_-]*\.js' | head -1)")"
          check() { echo "$2" | grep -qi "$3" || { echo "missing in $1: $3"; exit 1; }; }
          check index "$index" "^content-security-policy:.*frame-ancestors 'none'"
          check index "$index" "^x-content-type-options: nosniff"
          check index "$index" "^cross-origin-opener-policy: same-origin"
          check index "$index" "^cache-control: no-cache"
          check deep "$deep" "^HTTP/1.1 200"
          check deep "$deep" "^content-security-policy:"
          check asset "$asset" "^cache-control: public, max-age=31536000, immutable"
          check asset "$asset" "^x-content-type-options: nosniff"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # Smoke + axe against what nginx really serves (CSP, fonts, fallback).
      - name: Playwright against the container
        run: npm run e2e --workspace=web
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - name: Stop the container
        if: always()
        run: docker rm -f web-ci
