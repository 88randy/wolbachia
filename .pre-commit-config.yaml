# Install once per clone:  uv tool install pre-commit && pre-commit install
# (default_install_hook_types below installs both the pre-commit and commit-msg hooks.)
# Run everything:          pre-commit run --all-files
# Update pins:             pre-commit autoupdate   (then review the diff)
default_install_hook_types: [pre-commit, commit-msg]
# Without this, every hook would also run at commit-msg time (on the message file).
default_stages: [pre-commit]
# design/ is an external design export; issues/ mirrors GitHub Issues; both stay untouched.
exclude: ^(design|issues)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--config=backend/pyproject.toml, --fix]
      - id: ruff-format
        args: [--config=backend/pyproject.toml]

  # Strict only for services.py / selectors.py (see backend/pyproject.toml).
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        files: ^backend/(.*/)?(services|selectors)\.py$
        # Same set as the find in .github/workflows/backend.yml (migrations and .venv excluded).
        exclude: /(migrations|\.venv)/
        args: [--config-file=backend/pyproject.toml]

  # ESLint and Prettier run from node_modules so the hook uses the exact versions pinned in
  # package-lock.json (and the same ones CI runs). Run `npm ci` once before committing.
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx --no-install eslint --max-warnings=0 --no-warn-ignored
        language: system
        types_or: [javascript, jsx, ts, tsx]
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write --ignore-unknown
        language: system

  # Allowed scopes: backend, mobile, web, repo, tokens, i18n, api-client, docs.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--scopes, "backend,mobile,web,repo,tokens,i18n,api-client,docs"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
