# Local development stack: `docker compose -f backend/compose.yaml up --build` from the repo root.
# Dev-only credentials below are placeholders for a throwaway local database, not secrets.
name: wolbachia-backend

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: dev-only-change-me
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
  DATABASE_URL: postgres://wolbachia:wolbachia@db:5432/wolbachia
  REDIS_URL: redis://redis:6379/0

services:
  api:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment: *django-env
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A config worker --loglevel=INFO
    environment: *django-env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Exactly one beat instance per environment; workers may be scaled separately.
  beat:
    build: .
    command: celery -A config beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    environment: *django-env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    # Keep the major version equal to the DigitalOcean managed cluster [PENDING: confirm in #18].
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_USER: wolbachia
      POSTGRES_PASSWORD: wolbachia
      POSTGRES_DB: wolbachia
    ports:
      # Reserve host 5432 for other projects; workers must choose their own free port.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolbachia -d wolbachia"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      # Host overrides remain available for isolated worker stacks.
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"

volumes:
  pgdata:
