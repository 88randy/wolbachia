# Backend project: Django + DRF API shared by mobile and web (issue #2).
# Tool rules and rationale: docs/engineering-rules.md.
# Versions were verified on PyPI on 2026-11-03; Django follows the current LTS (5.2).

[project]
name = "wolbachia-backend"
version = "0.1.0"
description = "Wolbachia field operations API (Django + DRF)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "django>=5.2.19,<5.3",
  "djangorestframework>=3.18.3,<3.19",
  "drf-spectacular>=0.30.0,<0.31",
  "django-environ>=0.14.0,<0.15",
  "psycopg[binary]>=3.3.7,<3.4",
  "celery>=5.6.3,<5.7",
  "redis>=8.1.0,<8.2",
  "shapely>=2.2.0,<2.3",
  "pillow==13.0.0",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0,<9.3",
  "pytest-django>=4.14.0,<4.15",
  "pytest-cov>=7.1.0,<7.2",
  "factory-boy>=3.3.3,<3.4",
  "mypy==2.4.1",
  "django-stubs>=6.1.2,<6.2",
  "djangorestframework-stubs>=3.18.2,<3.19",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort (import order)
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "C90",  # mccabe complexity (limit below)
  "PLR0913",  # too many arguments (limit below)
  "T20",  # no print()
  "BLE",  # blind except
  "ERA",  # commented-out code
  "DJ",   # flake8-django
  "S",    # bandit (security)
  "PT",   # flake8-pytest-style
  "RET",  # flake8-return
  "TRY",  # tryceratops (exception handling)
  "ANN",  # type annotations
]
ignore = [
  "E501",    # line length is the formatter's job (ruff format), not a lint error
  "TRY003",  # long messages in exceptions: domain exceptions carry their message by design
]

[tool.ruff.lint.isort]
# Explicit so import order is the same whether ruff runs from backend/ (CI) or the repo root (pre-commit).
known-first-party = ["accounts", "catalogs", "ci", "community", "config", "core", "field_sync", "fleet", "geography", "incidents", "inventory", "lab", "ovitraps", "organizations", "reviews", "rules", "scheduling", "shifts", "tests", "uploads"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 3

[tool.ruff.lint.flake8-annotations]
# `-> None` is still required on public functions, but __init__ may omit it when typed.
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
# Tests: assert is the point, fixtures/factories take many args, annotations add noise.
"**/tests/**" = ["S101", "S105", "S106", "S603", "PLR0913", "ANN"]
"**/test_*.py" = ["S101", "S105", "S106", "S603", "PLR0913", "ANN"]
"**/conftest.py" = ["S101", "PLR0913", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ['/migrations/', '/\.venv/', '^tests/']
# Lenient everywhere; strict only where the business logic lives (override below).

[tool.django-stubs]
django_settings_module = "config.settings.test"

# Third-party packages without type information.
[[tool.mypy.overrides]]
module = ["celery.*", "environ.*", "factory.*", "shapely.*"]
ignore_missing_imports = true

# `strict = true` cannot be set per module, so the strict flags are listed one by one.
[[tool.mypy.overrides]]
module = ["services", "*.services", "selectors", "*.selectors", "accounts.token_retention", "fleet.fuel_services", "shifts.access", "inventory.access", "inventory.conditions", "inventory.masters", "inventory.transactions", "inventory.option_selectors", "inventory.transfers.*", "lab.*", "community.*", "incidents.automatic", "incidents.origins", "incidents.workspace_queries", "incidents.workspace_projection", "incidents.option_selectors", "ovitraps.lifecycle.advisory", "ovitraps.lifecycle.advisory_selectors"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["accounts", "catalogs", "community", "config", "core", "field_sync", "fleet", "geography", "incidents", "inventory", "lab", "ovitraps", "organizations", "reviews", "rules", "scheduling", "uploads"]
omit = ["*/migrations/*", "config/wsgi.py", "config/asgi.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
