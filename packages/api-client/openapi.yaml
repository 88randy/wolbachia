          format: double
          nullable: true
          readOnly: true
        effective_from:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        version_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        next_change_at:
          type: string
          format: date-time
