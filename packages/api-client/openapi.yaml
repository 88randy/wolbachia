openapi: 3.0.3
info:
  title: Wolbachia field API
  version: 1.0.0
  description: Single API for the mobile app and the web (see docs/api-conventions.md).
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the CSRF cookie for the web client, which sends it back as
        `X-CSRFToken`.
      tags:
      - auth
      responses:
        '204':
          description: No response body
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: '`POST /auth/login/`. With `device_id`: mobile tokens. Without:
        a web session (CSRF).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        `POST /auth/logout/`: end the web session or revoke the device session of the token.

        Idempotent: with no active session there is nothing to end and it still answers 204. The
        bearer variant accepts an expired or already revoked token, so the app can always log out.
        A web session is CSRF-protected like any authenticated request.
      tags:
      - auth
      security:
      - cookieAuth: []
      - bearerAuth: []
      - {}
      responses:
        '204':
          description: No response body
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        `POST /auth/password-reset/ {email}`: always `202`, whether or not the account exists.

        The view neither looks the address up nor waits for the email: it enqueues a task, so the
        answer, its body and its timing are the same for every address. The worker emails the link.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      responses:
        '202':
          description: No response body
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: |-
        `POST /auth/password-reset/confirm/ {uid, token, new_password}`: set the new password.

        Revokes the user's device sessions (`password_changed`; no final upload). Web sessions end by
        themselves because Django ties them to the password hash.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '204':
          description: No response body
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: '`POST /auth/refresh/`: rotate the token pair of a device session
        (mobile).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/catalogs/:
    get:
      operationId: catalogs_list
      description: 'The catalogs of the organization. They are created by the seed:
        there is no POST.'
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - catalogs
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCatalogList'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/catalogs/{catalog_slug}/items/:
    get:
      operationId: catalogs_items_list
      description: 'Items of `/catalogs/{catalog_slug}/items/`. No PUT and no DELETE:
        items are deactivated.'
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: catalog_slug
        schema:
          type: string
          pattern: ^[\w-]+$
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - catalogs
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCatalogItemList'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: catalogs_items_create
      description: 'Items of `/catalogs/{catalog_slug}/items/`. No PUT and no DELETE:
        items are deactivated.'
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: catalog_slug
        schema:
          type: string
          pattern: ^[\w-]+$
        required: true
      tags:
      - catalogs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogItemCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/catalogs/{catalog_slug}/items/{id}/:
    get:
      operationId: catalogs_items_retrieve
      description: 'Items of `/catalogs/{catalog_slug}/items/`. No PUT and no DELETE:
        items are deactivated.'
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: catalog_slug
        schema:
          type: string
          pattern: ^[\w-]+$
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this catalog item.
        required: true
      tags:
      - catalogs
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: catalogs_items_partial_update
      description: 'Items of `/catalogs/{catalog_slug}/items/`. No PUT and no DELETE:
        items are deactivated.'
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: catalog_slug
        schema:
          type: string
          pattern: ^[\w-]+$
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this catalog item.
        required: true
      tags:
      - catalogs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCatalogItemUpdateRequest'
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/catalogs/{catalog_slug}/items/{id}/activate/:
    post:
      operationId: catalogs_items_activate_create
      description: 'Items of `/catalogs/{catalog_slug}/items/`. No PUT and no DELETE:
        items are deactivated.'
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: catalog_slug
        schema:
          type: string
          pattern: ^[\w-]+$
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this catalog item.
        required: true
      tags:
      - catalogs
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/catalogs/{catalog_slug}/items/{id}/deactivate/:
    post:
      operationId: catalogs_items_deactivate_create
      description: 'Items of `/catalogs/{catalog_slug}/items/`. No PUT and no DELETE:
        items are deactivated.'
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: catalog_slug
        schema:
          type: string
          pattern: ^[\w-]+$
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this catalog item.
        required: true
      tags:
      - catalogs
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/devices/:
    get:
      operationId: devices_list
      description: Registered phones of the active organization (W67) and remote revocation
        of a lost one.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: query
        name: is_revoked
        schema:
          type: boolean
          nullable: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      tags:
      - devices
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeviceList'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/devices/{id}/:
    get:
      operationId: devices_retrieve
      description: Registered phones of the active organization (W67) and remote revocation
        of a lost one.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this device.
        required: true
      tags:
      - devices
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/devices/{id}/revoke/:
    post:
      operationId: devices_revoke_create
      description: |-
        Lost phone: the device can no longer log in and every session on it is revoked.

        `allow_final_upload: true` leaves the phone one last upload (default: none).
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this device.
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequestRequest'
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/field/catalog/:
    get:
      operationId: field_catalog_list
      description: '`GET /field/catalog/`: the compact copy of every catalog that
        phones keep offline.'
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
        description: The `ETag` (the snapshot `version`) the client already holds.
          When it is still current the answer is `304` with no body.
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      tags:
      - field
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogSnapshot'
          description: ''
        '304':
          description: No response body
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/field/rules/:
    get:
      operationId: field_rules_list
      description: '`GET /field/rules/`: the values in force now, for phones to keep
        offline.'
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
        description: The `ETag` (the snapshot `version`) the client already holds.
          When it is still current the answer is `304` with no body.
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      tags:
      - field
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RulesSnapshot'
          description: ''
        '304':
          description: No response body
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/field/sync/:
    post:
      operationId: field_sync_create
      description: Ingest the events idempotently and answer with one result per event
        plus `changes`.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      tags:
      - field
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatchRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Present only when a result has code rejection_quota_exceeded.
                Seconds until the next organization-local midnight (minimum 1). Keep
                those events in the outbox/quarantine and resend after this delay;
                they were not stored. Other results remain final.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: 'Liveness probe: no authentication, no organization, no throttling.'
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/me/:
    get:
      operationId: me_retrieve
      description: |-
        Who am I: user, active organization, profiles, permissions and scope.

        Unlike scoped resources, several memberships without `X-Organization` is not an error here:
        it answers `organization: null` plus the `organizations` list to choose from.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      tags:
      - me
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/motorcycles/:
    get:
      operationId: motorcycles_list
      description: |-
        Resolves the active organization of the request and scopes every query to it.

        Resolution lives here (not in middleware) so token auth (#4) and Channels (#19) reuse
        `resolve_active_membership`. The organization comes from the user's membership, never from
        the body: `organization_id` in a payload is ignored.

        ViewSets only: authorization and the 405 check rely on the `action` attribute, which plain
        `APIView`s do not have.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - name: code
        required: false
        in: query
        description: Exact human code of the resource (for example `OV-010`); returns
          0 or 1 results. Blank values are rejected.
        schema:
          type: string
          maxLength: 50
      - in: query
        name: include_voided
        schema:
          type: boolean
        description: Include voided motorcycles (default false).
      - in: query
        name: is_blocked
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - motorcycles
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMotorcycleList'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: motorcycles_create
      description: |-
        Resolves the active organization of the request and scopes every query to it.

        Resolution lives here (not in middleware) so token auth (#4) and Channels (#19) reuse
        `resolve_active_membership`. The organization comes from the user's membership, never from
        the body: `organization_id` in a payload is ignored.

        ViewSets only: authorization and the 405 check rely on the `action` attribute, which plain
        `APIView`s do not have.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      tags:
      - motorcycles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotorcycleWriteRequest'
        required: true
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Motorcycle'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/motorcycles/{id}/:
    get:
      operationId: motorcycles_retrieve
      description: |-
        Resolves the active organization of the request and scopes every query to it.

        Resolution lives here (not in middleware) so token auth (#4) and Channels (#19) reuse
        `resolve_active_membership`. The organization comes from the user's membership, never from
        the body: `organization_id` in a payload is ignored.

        ViewSets only: authorization and the 405 check rely on the `action` attribute, which plain
        `APIView`s do not have.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this motorcycle.
        required: true
      tags:
      - motorcycles
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Motorcycle'
          description: ''
        default:
