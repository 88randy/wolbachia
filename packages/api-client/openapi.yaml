      - in: path
        name: catalog_slug
        schema:
          type: string
          pattern: ^[\w-]+$
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this catalog item.
        required: true
      tags:
      - catalogs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/catalogs/{catalog_slug}/items/{id}/deactivate/:
    post:
      operationId: catalogs_items_deactivate_create
      description: 'Items of `/catalogs/{catalog_slug}/items/`. No PUT and no DELETE:
        items are deactivated.'
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: catalog_slug
        schema:
          type: string
          pattern: ^[\w-]+$
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this catalog item.
        required: true
      tags:
      - catalogs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/field/catalog/:
    get:
      operationId: field_catalog_list
      description: '`GET /field/catalog/`: the compact copy of every catalog that
        phones keep offline.'
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
        description: The `ETag` (the snapshot `version`) the client already holds.
          When it is still current the answer is `304` with no body.
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      tags:
      - field
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogSnapshot'
          description: ''
        '304':
          description: No response body
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/field/rules/:
    get:
      operationId: field_rules_list
      description: '`GET /field/rules/`: the values in force now, for phones to keep
        offline.'
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
        description: The `ETag` (the snapshot `version`) the client already holds.
          When it is still current the answer is `304` with no body.
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      tags:
      - field
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RulesSnapshot'
          description: ''
        '304':
          description: No response body
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: 'Liveness probe: no authentication, no organization, no throttling.'
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/me/:
    get:
      operationId: me_retrieve
      description: |-
        Who am I: user, active organization, profiles, permissions and scope.

        Unlike scoped resources, several memberships without `X-Organization` is not an error here:
        it answers `organization: null` plus the `organizations` list to choose from.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/rule-parameters/:
    get:
      operationId: rule_parameters_list
      description: Parameters of the organization with their current value. They are
        created by the seed.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - rule-parameters
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRuleParameterList'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/rule-parameters/{key}/:
    get:
      operationId: rule_parameters_retrieve
      description: Parameters of the organization with their current value. They are
        created by the seed.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: key
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        required: true
      tags:
      - rule-parameters
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleParameter'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/rule-parameters/{parameter_key}/versions/:
    get:
      operationId: rule_parameters_versions_list
      description: |-
        History of `/rule-parameters/{parameter_key}/versions/`: add a version, never edit one.

        A version that has not taken effect yet can be voided (`POST .../{id}/void/`). The detail
        route also makes PUT, PATCH and DELETE answer 405 instead of 404.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: parameter_key
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        required: true
      tags:
      - rule-parameters
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRuleParameterVersionList'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: rule_parameters_versions_create
      description: |-
        History of `/rule-parameters/{parameter_key}/versions/`: add a version, never edit one.

        A version that has not taken effect yet can be voided (`POST .../{id}/void/`). The detail
        route also makes PUT, PATCH and DELETE answer 405 instead of 404.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: parameter_key
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        required: true
      tags:
      - rule-parameters
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleParameterVersionCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleParameterVersion'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/rule-parameters/{parameter_key}/versions/{id}/:
    get:
      operationId: rule_parameters_versions_retrieve
      description: |-
        History of `/rule-parameters/{parameter_key}/versions/`: add a version, never edit one.

        A version that has not taken effect yet can be voided (`POST .../{id}/void/`). The detail
        route also makes PUT, PATCH and DELETE answer 405 instead of 404.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this rule parameter version.
        required: true
      - in: path
        name: parameter_key
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        required: true
      tags:
      - rule-parameters
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleParameterVersion'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/rule-parameters/{parameter_key}/versions/{id}/void/:
    post:
      operationId: rule_parameters_versions_void_create
      description: |-
        History of `/rule-parameters/{parameter_key}/versions/`: add a version, never edit one.

        A version that has not taken effect yet can be voided (`POST .../{id}/void/`). The detail
        route also makes PUT, PATCH and DELETE answer 405 instead of 404.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this rule parameter version.
        required: true
      - in: path
        name: parameter_key
        schema:
