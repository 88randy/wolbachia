  /api/v1/catalogs/:
    get:
      operationId: catalogs_list
      description: 'The catalogs of the organization. They are created by the seed:
        there is no POST.'
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - name: ordering
        required: false
        in: query
        description: 'Comma-separated fields: slug, label_es, label_en. Prefix with
          - for descending. Unsupported or blank terms return 400. Ties use id ascending.'
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
