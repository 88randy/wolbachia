  /api/v1/blocks/{id}/versions/:
    get:
      operationId: blocks_versions_list
      description: List, retrieve, create and update; there is deliberately no destroy.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: query
        name: created_by
        schema:
          type: string
          format: uuid
      - in: query
        name: effective_from_before
        schema:
          type: string
          format: date-time
      - in: query
        name: effective_from_from
        schema:
          type: string
          format: date-time
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this block.
        required: true
      - in: query
        name: ordering
        schema:
          enum:
          - revision
          - effective_from
          - created_at
          - created_by
          - -revision
          - -effective_from
          - -created_at
          - -created_by
          type: string
          default: -revision
          minLength: 1
        description: |-
          One ordering field, optional - for descending; ties use id ascending.

          * `revision` - revision
          * `effective_from` - effective_from
          * `created_at` - created_at
          * `created_by` - created_by
          * `-revision` - -revision
          * `-effective_from` - -effective_from
          * `-created_at` - -created_at
          * `-created_by` - -created_by
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: revision
        schema:
          type: integer
          minimum: 1
      tags:
      - blocks
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBlockVersionList'
          description: ''
        default:
