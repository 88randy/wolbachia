    PointVersion:
      type: object
      description: |-
        Base for the serializers of org-scoped models (mandatory, see docs/engineering-rules.md).

        Every relational field it builds is an `OrgScopedPrimaryKeyRelatedField`, so a payload can
        never link a record to another organization's data. Relations to models that are not
        org-scoped (`created_by`, `organization`...) must be read-only, or the serializer fails to
        build with `ImproperlyConfigured`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        point:
          type: string
          format: uuid
          readOnly: true
        location:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          readOnly: true
        version:
          type: integer
          readOnly: true
        effective_from:
          type: string
          format: date-time
          readOnly: true
        is_retired:
          type: boolean
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - effective_from
      - id
      - is_retired
      - location
      - point
      - version
    PointWrite:
      type: object
      properties:
        point:
          $ref: '#/components/schemas/SamplingPoint'
        spacing_warnings:
          type: array
          items:
            $ref: '#/components/schemas/SpacingWarning'
      required:
      - point
      - spacing_warnings
    PreviewRequestRequest:
      type: object
      properties:
