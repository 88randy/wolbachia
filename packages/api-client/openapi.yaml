      type: string
      description: |-
        * `integer` - Integer
        * `decimal` - Decimal
    VoidRequest:
      type: object
      description: Body of `POST .../void/`.
      properties:
        reason:
          type: string
          maxLength: 1000
      required:
      - reason
    WebLoginResponse:
      type: object
      properties:
        me:
          $ref: '#/components/schemas/Me'
        server_time:
          type: string
          format: date-time
      required:
      - me
      - server_time
    FieldError:
      type: object
      description: 'One validation failure of a field: a machine code plus its parameters.'
      properties:
        code:
          type: string
        params:
          type: object
          additionalProperties: {}
      required:
      - code
      - params
    BlockedBy:
      type: object
      description: Why a `409` action is blocked and who can unblock it.
      properties:
        reason:
          type: string
        unblocked_by_role:
          type: string
        link:
          type: string
      required:
      - reason
      - unblocked_by_role
      - link
    ErrorEnvelope:
      type: object
      description: Body of every 4xx/5xx response (docs/api-conventions.md). Clients
        translate `code` with packages/i18n; `detail` is English, for logs, and is
        never shown to users.
      properties:
        code:
          type: string
        detail:
          type: string
        fields:
          type: object
          description: 'Only on `400` validation errors: field name to its errors.'
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/FieldError'
        blocked_by:
          type: array
          description: Only on `409` blocked actions.
          items:
            $ref: '#/components/schemas/BlockedBy'
      required:
      - code
      - detail
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque access token.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
