          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - bags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissingBagRequest'
        required: true
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabReceptionConflict'
          description: ''
        default:
