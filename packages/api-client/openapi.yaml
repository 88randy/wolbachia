    Ovitrap:
      type: object
      description: |-
        Base for the serializers of org-scoped models (mandatory, see docs/engineering-rules.md).

        Every relational field it builds is an `OrgScopedPrimaryKeyRelatedField`, so a payload can
        never link a record to another organization's data. Relations to models that are not
        org-scoped (`created_by`, `organization`...) must be read-only, or the serializer fails to
        build with `ImproperlyConfigured`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
        is_retired:
          type: boolean
          readOnly: true
        suggest_relocation:
          type: boolean
          readOnly: true
        sampling_point:
          type: string
          format: uuid
          readOnly: true
        point_code:
          type: string
          readOnly: true
        point_version:
          type: string
          format: uuid
          readOnly: true
        evaluated_rules:
          readOnly: true
        rule_version_ids:
          readOnly: true
        supply_refs:
          readOnly: true
        evidence_ids:
          readOnly: true
        event_id:
          type: string
          format: uuid
          readOnly: true
        device_time:
          type: string
          format: date-time
          readOnly: true
        server_received_at:
          type: string
          format: date-time
          readOnly: true
        rules_version:
          type: string
          readOnly: true
        catalog_version:
          type: string
          readOnly: true
        manual_capture:
          type: boolean
          readOnly: true
        gps:
          type: object
          nullable: true
          properties:
            lat:
              type: number
            lng:
              type: number
            accuracy_m:
              type: number
              nullable: true
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OvitrapLifecycleStatusEnum'
          readOnly: true
        voided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        void_reason:
          type: string
          readOnly: true
        void_reason_code:
          type: string
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - catalog_version
      - code
      - created_at
      - created_by
      - device_time
      - evaluated_rules
      - event_id
      - evidence_ids
      - gps
      - id
      - is_retired
      - manual_capture
      - point_code
      - point_version
      - rule_version_ids
      - rules_version
      - sampling_point
      - server_received_at
      - status
      - suggest_relocation
      - supply_refs
      - void_reason
      - void_reason_code
      - voided_at
