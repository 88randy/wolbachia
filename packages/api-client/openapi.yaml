  /api/v1/blocks/:
    get:
      operationId: blocks_list
      description: List, retrieve, create and update; there is deliberately no destroy.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: query
        name: captured_at
        schema:
          type: string
          format: date-time
      - name: code
        required: false
        in: query
        description: Exact human code of the resource (for example `OV-010`); returns
          0 or 1 results. Blank values are rejected.
        schema:
          type: string
          maxLength: 50
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: quadrant
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - blocks
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBlockList'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: blocks_create
      description: List, retrieve, create and update; there is deliberately no destroy.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      tags:
      - blocks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Block'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
