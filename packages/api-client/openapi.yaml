          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    Catalog:
      type: object
      description: |-
        Base for the serializers of org-scoped models (mandatory, see docs/engineering-rules.md).

        Every relational field it builds is an `OrgScopedPrimaryKeyRelatedField`, so a payload can
        never link a record to another organization's data. Relations to models that are not
        org-scoped (`created_by`, `organization`...) must be read-only, or the serializer fails to
        build with `ImproperlyConfigured`.
      properties:
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        label_es:
          type: string
          readOnly: true
        label_en:
          type: string
          readOnly: true
        is_open:
          type: boolean
          readOnly: true
      required:
      - is_open
      - label_en
      - label_es
      - slug
    CatalogItem:
      type: object
      description: Read shape of an item. `is_active` and `is_other` change only through
        their own rules.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
        label_es:
          type: string
          readOnly: true
        label_en:
          type: string
          readOnly: true
        icon:
          type: string
          readOnly: true
        sort:
          type: integer
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_other:
          type: boolean
          readOnly: true
        requires_photo:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - icon
      - id
      - is_active
      - is_other
      - label_en
      - label_es
      - requires_photo
      - sort
      - updated_at
    CatalogItemCreateRequest:
      type: object
      description: '`sort` is optional: an omitted value appends the item at the end
        of the catalog.'
      properties:
        code:
          type: string
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9_-]*$
          maxLength: 64
        label_es:
          type: string
          minLength: 1
          maxLength: 200
        label_en:
          type: string
          maxLength: 200
        icon:
          oneOf:
          - type: string
            pattern: ^[a-z0-9-]+$
            maxLength: 64
          - type: string
            maxLength: 0
        sort:
          type: integer
          maximum: 10000
          minimum: 0
        requires_photo:
          type: boolean
      required:
      - code
      - label_es
    CatalogSnapshot:
      type: object
      description: Every catalog with its active items. `version` is also the `ETag`.
      properties:
        version:
          type: string
        catalogs:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotCatalog'
      required:
      - catalogs
      - version
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Me:
      type: object
      description: '`organization` is null when the user has several organizations
        and sent no header.'
      properties:
        user:
          $ref: '#/components/schemas/MeUser'
        organization:
          allOf:
          - $ref: '#/components/schemas/MeOrganization'
          nullable: true
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/MeProfile'
        permissions:
          type: array
          items:
            type: string
        scope:
          $ref: '#/components/schemas/MeScope'
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/MeOrganizationChoice'
      required:
      - organization
      - organizations
      - permissions
      - profiles
      - scope
      - user
    MeOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
        country:
          type: string
        timezone:
          type: string
        languages:
          type: array
          items:
            type: string
        logo_url:
          type: string
          nullable: true
          readOnly: true
      required:
      - country
      - id
      - languages
      - logo_url
      - name
      - slug
      - timezone
    MeOrganizationChoice:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
      required:
      - name
      - slug
    MeProfile:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        label_es:
          type: string
        label_en:
          type: string
      required:
      - label_en
      - label_es
      - slug
    MeScope:
      type: object
      properties:
        centers:
          type: array
          items:
            type: string
        quadrants:
          type: array
          items:
            type: string
      required:
      - centers
      - quadrants
    MeUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
      required:
      - email
      - first_name
      - id
      - last_name
      - username
    PaginatedCatalogItemList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
    PaginatedCatalogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Catalog'
    PaginatedRuleParameterList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/RuleParameter'
    PaginatedRuleParameterVersionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/RuleParameterVersion'
    PatchedCatalogItemUpdateRequest:
      type: object
      description: '`code`, `is_other` and `is_active` are not editable here: unknown
        keys are ignored.'
      properties:
        label_es:
          type: string
          minLength: 1
          maxLength: 200
        label_en:
          type: string
          maxLength: 200
        icon:
          oneOf:
          - type: string
            pattern: ^[a-z0-9-]+$
            maxLength: 64
          - type: string
            maxLength: 0
        sort:
          type: integer
          maximum: 10000
          minimum: 0
        requires_photo:
          type: boolean
    RuleParameter:
      type: object
      description: |-
        A parameter with the value in force now. Values are JSON numbers; null means no version yet.

        `value`, `effective_from`, `version_id` and `next_change_at` come from the annotations of
        `rules.selectors.list_parameters_with_current`.
      properties:
        key:
          type: string
          readOnly: true
        value_type:
          allOf:
          - $ref: '#/components/schemas/ValueTypeEnum'
          readOnly: true
        unit:
          allOf:
          - $ref: '#/components/schemas/UnitEnum'
          readOnly: true
        min_value:
          type: number
          format: double
          nullable: true
          readOnly: true
        max_value:
          type: number
          format: double
          nullable: true
          readOnly: true
        value:
          type: number
          format: double
          nullable: true
          readOnly: true
        effective_from:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        version_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        next_change_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - effective_from
      - key
      - max_value
      - min_value
      - next_change_at
      - unit
      - value
      - value_type
      - version_id
    RuleParameterVersion:
      type: object
      description: Read shape of a version, with its `status` at the time of the request.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        value:
          type: number
          format: double
          readOnly: true
        effective_from:
          type: string
          format: date-time
          readOnly: true
        effective_date:
          type: string
          format: date
          readOnly: true
        reason:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        voided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        voided_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        void_reason:
          type: string
          readOnly: true
      required:
      - created_at
      - created_by
      - effective_date
      - effective_from
      - id
      - reason
      - status
      - value
      - void_reason
      - voided_at
      - voided_by
    RuleParameterVersionCreateRequest:
      type: object
      description: '`effective_from` is a local calendar date (`YYYY-MM-DD`): the
        server resolves the instant.'
      properties:
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        effective_from:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - effective_from
      - reason
      - value
    RulesSnapshot:
      type: object
      description: The values in force now. `version` is also the `ETag`.
      properties:
        version:
          type: string
        next_change_at:
          type: string
          format: date-time
          nullable: true
          description: When the next scheduled version takes effect, if any.
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotParameter'
      required:
      - next_change_at
      - parameters
      - version
    SnapshotCatalog:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        label_es:
          type: string
        label_en:
          type: string
        is_open:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotItem'
      required:
      - is_open
      - items
      - label_en
      - label_es
      - slug
    SnapshotItem:
      type: object
      description: Documents the field snapshot (the payload is built by `build_catalog_snapshot`).
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        label_es:
          type: string
        label_en:
          type: string
          description: 'Blank: fall back to `label_es`.'
        icon:
          type: string
        sort:
          type: integer
        is_other:
          type: boolean
        requires_photo:
          type: boolean
      required:
      - code
      - icon
      - id
      - is_other
      - label_en
      - label_es
      - requires_photo
      - sort
    SnapshotParameter:
      type: object
      description: Documents the field rules snapshot (the payload is built by `build_rules_snapshot`).
      properties:
        key:
          type: string
        value_type:
          $ref: '#/components/schemas/ValueTypeEnum'
        unit:
          $ref: '#/components/schemas/UnitEnum'
        value:
          type: number
          format: double
          nullable: true
          description: 'Null: not configured yet.'
        effective_from:
          type: string
          format: date-time
          nullable: true
        version_id:
          type: string
          format: uuid
          nullable: true
      required:
      - effective_from
      - key
      - unit
      - value
      - value_type
      - version_id
    StatusEnum:
      enum:
      - scheduled
      - in_force
      - superseded
      - voided
      type: string
      description: |-
        * `scheduled` - scheduled
        * `in_force` - in_force
        * `superseded` - superseded
        * `voided` - voided
    UnitEnum:
      enum:
      - m
      - km_h
      - s
      - min
      - week
      - count
      - km_l
      type: string
      description: |-
        * `m` - Meters
        * `km_h` - Kilometers Per Hour
        * `s` - Seconds
        * `min` - Minutes
        * `week` - Weeks
        * `count` - Count
        * `km_l` - Kilometers Per Liter
    ValueTypeEnum:
      enum:
      - integer
      - decimal
      type: string
      description: |-
        * `integer` - Integer
        * `decimal` - Decimal
    VoidRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - reason
    FieldError:
      type: object
      description: 'One validation failure of a field: a machine code plus its parameters.'
      properties:
        code:
          type: string
        params:
          type: object
          additionalProperties: {}
      required:
      - code
      - params
    BlockedBy:
      type: object
      description: Why a `409` action is blocked and who can unblock it.
      properties:
        reason:
          type: string
        unblocked_by_role:
          type: string
        link:
          type: string
      required:
      - reason
      - unblocked_by_role
      - link
    ErrorEnvelope:
      type: object
      description: Body of every 4xx/5xx response (docs/api-conventions.md). Clients
        translate `code` with packages/i18n; `detail` is English, for logs, and is
        never shown to users.
      properties:
        code:
          type: string
        detail:
          type: string
        fields:
          type: object
          description: 'Only on `400` validation errors: field name to its errors.'
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/FieldError'
        blocked_by:
          type: array
          description: Only on `409` blocked actions.
          items:
            $ref: '#/components/schemas/BlockedBy'
      required:
      - code
      - detail
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
