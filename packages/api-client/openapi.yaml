openapi: 3.0.3
info:
  title: Wolbachia field API
  version: 1.0.0
  description: Single API for the mobile app and the web (see docs/api-conventions.md).
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the CSRF cookie for the web client, which sends it back as
        `X-CSRFToken`.
      tags:
      - auth
      responses:
        '204':
          description: No response body
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: '`POST /auth/login/`. With `device_id`: mobile tokens. Without:
        a web session (CSRF).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        `POST /auth/logout/`: end the web session or revoke the device session of the token.

        Idempotent: with no active session there is nothing to end and it still answers 204. The
        bearer variant accepts an expired or already revoked token, so the app can always log out.
        A web session is CSRF-protected like any authenticated request.
      tags:
      - auth
      security:
      - cookieAuth: []
      - bearerAuth: []
      - {}
      responses:
        '204':
          description: No response body
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        `POST /auth/password-reset/ {email}`: always `202`, whether or not the account exists.

        The view neither looks the address up nor waits for the email: it enqueues a task, so the
        answer, its body and its timing are the same for every address. The worker emails the link.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      responses:
        '202':
          description: No response body
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: |-
        `POST /auth/password-reset/confirm/ {uid, token, new_password}`: set the new password.

        Revokes the user's device sessions (`password_changed`; no final upload). Web sessions end by
        themselves because Django ties them to the password hash.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '204':
          description: No response body
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: '`POST /auth/refresh/`: rotate the token pair of a device session
        (mobile).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/bags/:
    get:
      operationId: bags_list
      description: |-
        Resolves the active organization of the request and scopes every query to it.

        Resolution lives here (not in middleware) so token auth (#4) and Channels (#19) reuse
        `resolve_active_membership`. The organization comes from the user's membership, never from
        the body: `organization_id` in a payload is ignored.

        ViewSets only: authorization and the 405 check rely on the `action` attribute, which plain
        `APIView`s do not have.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: query
        name: code
        schema:
          type: string
          minLength: 1
          maxLength: 50
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: point
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          enum:
          - active
          - voided
          - all
          type: string
          minLength: 1
        description: |-
          * `active` - active
          * `voided` - voided
          * `all` - all
      - in: query
        name: week
        schema:
          type: string
          minLength: 1
          pattern: ^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$
      tags:
      - bags
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBagList'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/bags/{id}/:
    get:
      operationId: bags_retrieve
      description: |-
        Resolves the active organization of the request and scopes every query to it.

        Resolution lives here (not in middleware) so token auth (#4) and Channels (#19) reuse
        `resolve_active_membership`. The organization comes from the user's membership, never from
        the body: `organization_id` in a payload is ignored.

        ViewSets only: authorization and the 405 check rely on the `action` attribute, which plain
        `APIView`s do not have.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - bags
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bag'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/blocks/:
