      type: object
      description: The envelope of one event. `payload` is a JSON object; its content
        is the handler's.
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$
        schema_version:
          type: integer
          maximum: 32767
          minimum: 1
        device_time:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: {}
        shift_id:
          type: string
          format: uuid
          nullable: true
        gps:
          allOf:
          - $ref: '#/components/schemas/GpsRequest'
          nullable: true
        rules_version:
          type: string
          maxLength: 64
        catalog_version:
          type: string
          maxLength: 64
        manual_capture:
          type: boolean
          default: false
        voids_event_id:
          type: string
          format: uuid
          nullable: true
      required:
      - catalog_version
      - device_time
      - id
      - payload
      - rules_version
      - schema_version
      - type
    SyncResponse:
      type: object
      properties:
        server_time:
          type: string
          format: date-time
        results:
          type: array
          items:
            $ref: '#/components/schemas/EventResult'
        changes:
          $ref: '#/components/schemas/Changes'
      required:
      - changes
