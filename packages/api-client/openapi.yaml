      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$
        schema_version:
          type: integer
          maximum: 32767
          minimum: 1
        device_time:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: {}
        shift_id:
          type: string
          format: uuid
          nullable: true
