openapi: 3.0.3
info:
  title: Wolbachia field API
  version: 1.0.0
  description: Single API for the mobile app and the web (see docs/api-conventions.md).
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the CSRF cookie for the web client, which sends it back as
        `X-CSRFToken`.
      tags:
      - auth
      responses:
        '204':
          description: No response body
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: '`POST /auth/login/`. With `device_id`: mobile tokens. Without:
        a web session (CSRF).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        `POST /auth/logout/`: end the web session or revoke the device session of the token.

        Idempotent: with no active session there is nothing to end and it still answers 204. The
        bearer variant accepts an expired or already revoked token, so the app can always log out.
        A web session is CSRF-protected like any authenticated request.
      tags:
      - auth
      security:
      - cookieAuth: []
      - bearerAuth: []
      - {}
      responses:
        '204':
          description: No response body
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        `POST /auth/password-reset/ {email}`: always `202`, whether or not the account exists.

        The view neither looks the address up nor waits for the email: it enqueues a task, so the
        answer, its body and its timing are the same for every address. The worker emails the link.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      responses:
        '202':
          description: No response body
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: |-
        `POST /auth/password-reset/confirm/ {uid, token, new_password}`: set the new password.

        Revokes the user's device sessions (`password_changed`; no final upload). Web sessions end by
        themselves because Django ties them to the password hash.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '204':
          description: No response body
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: '`POST /auth/refresh/`: rotate the token pair of a device session
        (mobile).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/devices/:
    get:
      operationId: devices_list
      description: Registered phones of the active organization (W67) and remote revocation
        of a lost one.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: query
        name: is_revoked
        schema:
          type: boolean
          nullable: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      tags:
      - devices
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeviceList'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/devices/{id}/:
    get:
      operationId: devices_retrieve
      description: Registered phones of the active organization (W67) and remote revocation
        of a lost one.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this device.
        required: true
      tags:
      - devices
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/devices/{id}/revoke/:
    post:
      operationId: devices_revoke_create
      description: |-
        Lost phone: the device can no longer log in and every session on it is revoked.

        `allow_final_upload: true` leaves the phone one last upload (default: none).
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this device.
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequestRequest'
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: 'Liveness probe: no authentication, no organization, no throttling.'
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/me/:
    get:
      operationId: me_retrieve
      description: |-
        Who am I: user, active organization, profiles, permissions and scope.

        Unlike scoped resources, several memberships without `X-Organization` is not an error here:
        it answers `organization: null` plus the `organizations` list to choose from.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      tags:
      - me
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/users/{id}/revoke-device-sessions/:
    post:
      operationId: users_revoke_device_sessions_create
      description: |-
        Revoke every phone session the user has in the active organization (W49).

        `allow_final_upload: true` leaves each phone one last upload (default: none).
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequestRequest'
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedSessions'
          description: ''
        default:
          description: 'Error: any 4xx or 5xx status, with the error envelope as body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    Device:
      type: object
      description: Read-only view of a device for administrators (W67).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          readOnly: true
        serial:
          type: string
          readOnly: true
        app_version:
          type: string
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_user:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        last_user_username:
          type: string
          readOnly: true
          nullable: true
        is_revoked:
          type: boolean
          readOnly: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - app_version
      - created_at
      - id
      - is_revoked
      - label
      - last_seen_at
      - last_user
      - last_user_username
      - revoked_at
      - revoked_by
      - serial
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    LoginRequest:
      type: object
      description: With `device_id` the login is a mobile one (tokens); without it,
        a web session.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
        device_id:
          type: string
          format: uuid
        app_version:
          type: string
          maxLength: 50
        label:
          type: string
          maxLength: 100
      required:
      - password
      - username
    LoginResponse:
      oneOf:
      - $ref: '#/components/schemas/MobileLoginResponse'
      - $ref: '#/components/schemas/WebLoginResponse'
    Me:
      type: object
      description: '`organization` is null when the user has several organizations
        and sent no header.'
      properties:
        user:
          $ref: '#/components/schemas/MeUser'
        organization:
          allOf:
          - $ref: '#/components/schemas/MeOrganization'
          nullable: true
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/MeProfile'
        permissions:
          type: array
          items:
            type: string
        scope:
          $ref: '#/components/schemas/MeScope'
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/MeOrganizationChoice'
      required:
      - organization
      - organizations
      - permissions
      - profiles
      - scope
      - user
    MeOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
        country:
          type: string
        timezone:
          type: string
        languages:
          type: array
          items:
            type: string
        logo_url:
          type: string
          nullable: true
          readOnly: true
      required:
      - country
      - id
      - languages
      - logo_url
      - name
      - slug
      - timezone
    MeOrganizationChoice:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
      required:
      - name
      - slug
    MeProfile:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        label_es:
          type: string
        label_en:
          type: string
      required:
      - label_en
      - label_es
      - slug
    MeScope:
      type: object
      properties:
        centers:
          type: array
          items:
            type: string
        quadrants:
          type: array
          items:
            type: string
      required:
      - centers
      - quadrants
    MeUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
      required:
      - email
      - first_name
      - id
      - last_name
      - username
    MobileLoginResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        me:
          $ref: '#/components/schemas/Me'
        server_time:
          type: string
          format: date-time
      required:
      - access
      - me
      - refresh
      - server_time
    PaginatedDeviceList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    PasswordResetConfirmRequest:
      type: object
      description: Resolves the link first, so a bad link never reveals the password
        rules.
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 512
        token:
          type: string
          minLength: 1
          maxLength: 512
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
      required:
      - new_password
      - token
      - uid
    PasswordResetRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
          maxLength: 512
        device_id:
          type: string
          format: uuid
      required:
      - device_id
      - refresh
    RefreshResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        server_time:
          type: string
          format: date-time
      required:
      - access
      - refresh
      - server_time
    RevokeRequestRequest:
      type: object
      description: 'Body of the two revoke actions. Everything is optional: an empty
        body is accepted.'
      properties:
        allow_final_upload:
          type: boolean
          default: false
    RevokedSessions:
      type: object
      properties:
        revoked_sessions:
          type: integer
      required:
      - revoked_sessions
    WebLoginResponse:
      type: object
      properties:
        me:
          $ref: '#/components/schemas/Me'
        server_time:
          type: string
          format: date-time
      required:
      - me
      - server_time
    FieldError:
      type: object
      description: 'One validation failure of a field: a machine code plus its parameters.'
      properties:
        code:
          type: string
        params:
          type: object
          additionalProperties: {}
      required:
      - code
      - params
    BlockedBy:
      type: object
      description: Why a `409` action is blocked and who can unblock it.
      properties:
        reason:
          type: string
        unblocked_by_role:
          type: string
        link:
          type: string
      required:
      - reason
      - unblocked_by_role
      - link
    ErrorEnvelope:
      type: object
      description: Body of every 4xx/5xx response (docs/api-conventions.md). Clients
        translate `code` with packages/i18n; `detail` is English, for logs, and is
        never shown to users.
      properties:
        code:
          type: string
        detail:
          type: string
        fields:
          type: object
          description: 'Only on `400` validation errors: field name to its errors.'
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/FieldError'
        blocked_by:
          type: array
          description: Only on `409` blocked actions.
          items:
            $ref: '#/components/schemas/BlockedBy'
      required:
      - code
      - detail
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque access token.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
