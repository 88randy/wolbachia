components:
  schemas:
    BlankEnum:
      enum:
      - ''
    BlockedReasonEnum:
      enum:
      - severe_check
      - service_overdue
      - out_of_service
      type: string
      description: |-
        * `severe_check` - Severe Check
        * `service_overdue` - Service Overdue
        * `out_of_service` - Out Of Service
    Catalog:
      type: object
      description: |-
        Base for the serializers of org-scoped models (mandatory, see docs/engineering-rules.md).

        Every relational field it builds is an `OrgScopedPrimaryKeyRelatedField`, so a payload can
        never link a record to another organization's data. Relations to models that are not
        org-scoped (`created_by`, `organization`...) must be read-only, or the serializer fails to
        build with `ImproperlyConfigured`.
      properties:
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        label_es:
          type: string
          readOnly: true
        label_en:
          type: string
          readOnly: true
        is_open:
          type: boolean
          readOnly: true
      required:
      - is_open
      - label_en
      - label_es
      - slug
    CatalogItem:
      type: object
      description: Read shape of an item. `is_active` and `is_other` change only through
        their own rules.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
        label_es:
          type: string
          readOnly: true
        label_en:
          type: string
          readOnly: true
        icon:
          type: string
          readOnly: true
        sort:
          type: integer
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_other:
          type: boolean
          readOnly: true
        requires_photo:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - icon
      - id
      - is_active
      - is_other
      - label_en
      - label_es
      - requires_photo
      - sort
      - updated_at
    CatalogItemCreateRequest:
      type: object
      description: '`sort` is optional: an omitted value appends the item at the end
        of the catalog.'
      properties:
        code:
          type: string
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9_-]*$
          maxLength: 64
        label_es:
          type: string
          minLength: 1
          maxLength: 200
        label_en:
          type: string
          maxLength: 200
        icon:
          oneOf:
          - type: string
            pattern: ^[a-z0-9-]+$
            maxLength: 64
          - type: string
            maxLength: 0
        sort:
          type: integer
          maximum: 10000
          minimum: 0
        requires_photo:
          type: boolean
      required:
      - code
      - label_es
    CatalogSnapshot:
      type: object
      description: Every catalog with its active items. `version` is also the `ETag`.
      properties:
        version:
          type: string
        catalogs:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotCatalog'
        motorcycles:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotMotorcycle'
      required:
      - catalogs
      - motorcycles
      - version
    Changes:
      type: object
      properties:
        cursor:
          type: string
          nullable: true
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewChange'
        catalog_version:
          type: string
          nullable: true
        rules_version:
          type: string
          nullable: true
        has_more:
          type: boolean
      required:
      - catalog_version
      - cursor
      - has_more
      - reviews
      - rules_version
    CheckResultEnum:
      enum:
      - ok
      - minor
      - severe
      type: string
      description: |-
        * `ok` - Ok
        * `minor` - Minor
        * `severe` - Severe
    Device:
      type: object
      description: Read-only view of a device for administrators (W67).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          readOnly: true
        serial:
          type: string
          readOnly: true
        app_version:
          type: string
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_user:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        last_user_username:
          type: string
          readOnly: true
          nullable: true
        is_revoked:
          type: boolean
          readOnly: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - app_version
      - created_at
      - id
      - is_revoked
      - label
      - last_seen_at
      - last_user
      - last_user_username
      - revoked_at
      - revoked_by
      - serial
    EventResult:
      type: object
      description: |-
        One ingestion verdict. rejection_quota_exceeded is not stored: retain and retry the event
        after params.retry_after_seconds (also the 200 response's Retry-After header).
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/EventStatusEnum'
        code:
          type: string
        params:
          type: object
          additionalProperties: {}
      required:
      - code
      - id
      - params
      - status
    EventStatusEnum:
      enum:
      - accepted
      - rejected
      - in_review
      type: string
      description: |-
        * `accepted` - Accepted
        * `rejected` - Rejected
        * `in_review` - In Review
    GpsRequest:
      type: object
      properties:
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
        accuracy_m:
          type: number
          format: double
          minimum: 0
      required:
      - accuracy_m
      - lat
      - lng
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    LoginRequest:
      type: object
      description: With `device_id` the login is a mobile one (tokens); without it,
        a web session.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
        device_id:
          type: string
          format: uuid
        app_version:
          type: string
          maxLength: 50
        label:
          type: string
          maxLength: 100
      required:
      - password
      - username
    LoginResponse:
      oneOf:
      - $ref: '#/components/schemas/MobileLoginResponse'
      - $ref: '#/components/schemas/WebLoginResponse'
    Me:
      type: object
      description: '`organization` is null when the user has several organizations
        and sent no header.'
      properties:
        user:
          $ref: '#/components/schemas/MeUser'
        organization:
          allOf:
          - $ref: '#/components/schemas/MeOrganization'
          nullable: true
        profiles:
          type: array
