      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization. Required only for users with
          more than one active membership; when sent it is always validated.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this block.
        required: true
      tags:
      - blocks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeometryPublicationRequest'
        required: true
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockVersion'
          description: ''
        default:
