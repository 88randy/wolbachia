# Static hosting of the Vite build behind an unprivileged nginx (port 8080).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Hashed file names: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The emailed reset link carries a one-time token in its path: keep it out of access logs.
    location /reset-password/ {
        access_log off;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Single-page app: every other address serves index.html and the router decides.
    # index.html must never be cached, or a deploy would keep serving old asset names.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
