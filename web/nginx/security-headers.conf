# Included by every location of default.conf: nginx drops the headers of the parent level as
# soon as a location sets its own add_header, so they cannot live only at server level.
#
# [ASSUMPTION] the API is on the same origin (a proxy in front routes /api/ to the backend), so
# The API origin is 'self'; the build separately narrows the map origin. Extend only for a verified API host.
# HSTS (Strict-Transport-Security) is NOT set here: this container speaks plain HTTP behind a
# TLS-terminating proxy (issue #18), and only that proxy knows the site is served over HTTPS.
# It must add `Strict-Transport-Security` itself.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
# strict-origin sends only the origin to tiles, never reset-token paths or fragments.
# Build output narrows the tile origin to VITE_MAP_TILES_URL; no wildcard sources.
add_header Referrer-Policy "strict-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://tile.openstreetmap.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
