# Included by every location of default.conf: nginx drops the headers of the parent level as
# soon as a location sets its own add_header, so they cannot live only at server level.
#
# [ASSUMPTION] the API is on the same origin (a proxy in front routes /api/ to the backend), so
# connect-src is 'self'. If the API lives on another origin, add it to connect-src.
# HSTS (Strict-Transport-Security) is NOT set here: this container speaks plain HTTP behind a
# TLS-terminating proxy (issue #18), and only that proxy knows the site is served over HTTPS.
# It must add `Strict-Transport-Security` itself.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
# no-referrer: the emailed reset link carries a one-time token in its path, and nothing in the app
# needs a Referer (Django checks Origin first for CSRF).
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
